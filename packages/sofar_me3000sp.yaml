# Sensors for one SOFAR ME3000SP inverter on the shared RS485/Modbus bus.
#
# Include once per inverter from the main config, passing:
#   name_prefix:    prepended to every entity name ("" keeps the original names)
#   id_prefix:      unique prefix for internal ESPHome ids (e.g. inverter1)
#   modbus_address: the inverter's RS485 address (inverter menu:
#                   Settings > 5. Set Communication Addr.)
#
# Expects the main config to define a modbus component with id: modbus1.

modbus_controller:
  - id: ${id_prefix}_controller
    address: ${modbus_address}
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 5s

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Running State"
    icon: "mdi:state-machine"
    address: 0x0200
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    id: ${id_prefix}_running_state
    on_value:
      then:
       - text_sensor.template.publish:
           id: ${id_prefix}_state_description
           state: !lambda |-
            static const char *const STATES[] = {
              "Wait", "Check", "Normal", "Check Discharge",
              "Discharge", "EPS", "Fault (temporary)", "Fault (permanent)"};
            int s = (int) x;
            if (s >= 0 && s < 8) return STATES[s];
            return "Unknown (" + std::to_string(s) + ")";
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Fault Message 1"
    address: 0x0201
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    icon: "mdi:alert-circle"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Fault Message 2"
    address: 0x0202
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    icon: "mdi:alert-circle"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Fault Message 3"
    address: 0x0203
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    icon: "mdi:alert-circle"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Fault Message 4"
    address: 0x0204
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    icon: "mdi:alert-circle"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Fault Message 5"
    address: 0x0205
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    icon: "mdi:alert-circle"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Grid Voltage"
    address: 0x0206
    register_type: "holding"
    value_type: U_WORD
    filters:
      - multiply: 0.1
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 1
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Grid Current"
    icon: "mdi:current-ac"
    address: 0x0207
    register_type: "holding"
    value_type: S_WORD
    filters:
      - multiply: 0.01
    device_class: current
    state_class: measurement
    unit_of_measurement: "A"
    accuracy_decimals: 2
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Grid Frequency"
    icon: "mdi:sine-wave"
    address: 0x020c
    register_type: "holding"
    value_type: U_WORD
    filters:
      - multiply: 0.01
    device_class: frequency
    state_class: measurement
    unit_of_measurement: "Hz"
    accuracy_decimals: 2
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Battery Power"
    icon: "mdi:battery-charging"
    address: 0x020d
    register_type: "holding"
    value_type: S_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Battery Voltage"
    address: 0x020e
    register_type: "holding"
    value_type: U_WORD
    filters:
      - multiply: 0.01
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 2
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Battery Current"
    address: 0x020f
    register_type: "holding"
    value_type: S_WORD
    filters:
      - multiply: 0.01
    device_class: current
    state_class: measurement
    unit_of_measurement: "A"
    accuracy_decimals: 2
    icon: "mdi:current-dc"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}State of Charge"
    address: 0x0210
    register_type: "holding"
    value_type: U_WORD
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Battery Temperature"
    address: 0x0211
    register_type: "holding"
    value_type: S_WORD
    accuracy_decimals: 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Feed Power"
    icon: "mdi:transmission-tower"
    address: 0x0212
    register_type: "holding"
    value_type: S_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Load Power"
    icon: "mdi:home-lightning-bolt"
    address: 0x0213
    register_type: "holding"
    value_type: U_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Input Output Power"
    icon: "mdi:swap-vertical"
    address: 0x0214
    register_type: "holding"
    value_type: S_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Generation Power"
    icon: "mdi:solar-power"
    address: 0x0215
    register_type: "holding"
    value_type: U_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}EPS Voltage"
    icon: "mdi:home-battery"
    address: 0x0216
    register_type: "holding"
    value_type: U_WORD
    filters:
      - multiply: 0.1
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 1
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}EPS Power"
    icon: "mdi:home-battery"
    address: 0x0217
    register_type: "holding"
    value_type: U_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Energy Generation (Day)"
    address: 0x0218
    register_type: "holding"
    value_type: U_WORD
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - multiply: 10
    icon: "mdi:solar-power"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Energy Export (Day)"
    address: 0x0219
    register_type: "holding"
    value_type: U_WORD
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - multiply: 10
    icon: "mdi:transmission-tower-export"
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Energy Import (Day)"
    address: 0x021a
    register_type: "holding"
    value_type: U_WORD
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - multiply: 10
    icon: "mdi:transmission-tower-import"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Energy Consumption (Day)"
    icon: "mdi:home-lightning-bolt-outline"
    address: 0x021b
    register_type: "holding"
    value_type: U_WORD
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - multiply: 10

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Total generation"
    icon: "mdi:solar-power-variant"
    address: 0x021c
    register_type: "holding"
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Total export"
    address: 0x021e
    register_type: "holding"
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    icon: "mdi:transmission-tower-export"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Total import"
    address: 0x0220
    register_type: "holding"
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    icon: "mdi:transmission-tower-import"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Total load consumption"
    icon: "mdi:home-lightning-bolt-outline"
    address: 0x0222
    register_type: "holding"
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Energy Battery Charge (Day)"
    address: 0x0224
    register_type: "holding"
    value_type: U_WORD
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - multiply: 10
    icon: "mdi:battery-plus-outline"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Energy Battery Discharged (Day)"
    address: 0x0225
    register_type: "holding"
    value_type: U_WORD
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - multiply: 10
    icon: "mdi:battery-minus-outline"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Count Down Timer"
    address: 0x022a
    register_type: "holding"
    value_type: U_WORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:timer-outline"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Inverter Alert Message"
    address: 0x022b
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    icon: "mdi:alert-circle"
    on_value:
      then:
       - text_sensor.template.publish:
           id: ${id_prefix}_alert_description
           state: !lambda |-
            std::string message="";
            int value=(int)x;
            if ((value & 1)) {
              message.append("ID81 ");
            }
            if ((value & 2)) {
              message.append("ID82 ");
            }
            if ((value & 4)) {
              message.append("ID83 ");
            }
            if ((value & 8)) {
              message.append("ID84 ");
            }
            if ((value & 128)) {
              message.append("ID85 ");
            }
            return message;

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Battery Cycles"
    address: 0x022c
    register_type: "holding"
    value_type: U_WORD
    state_class: total_increasing
    accuracy_decimals: 0
    icon: "mdi:battery-sync"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Inverter Temperature"
    address: 0x0238
    register_type: "holding"
    value_type: S_WORD
    accuracy_decimals: 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Inverter Heat Sink Temperature"
    address: 0x0239
    register_type: "holding"
    value_type: S_WORD
    accuracy_decimals: 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

text_sensor:
  - platform: template
    name: "${name_prefix}Running State Description"
    id: ${id_prefix}_state_description
    icon: "mdi:information-outline"

  - platform: template
    name: "${name_prefix}Inverter Alert Description"
    id: ${id_prefix}_alert_description
    icon: "mdi:alert"

