      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Load Power"
    icon: "mdi:home-lightning-bolt"
    address: 0x0213
    register_type: "holding"
    value_type: U_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Input Output Power"
    icon: "mdi:swap-vertical"
    address: 0x0214
    register_type: "holding"
    value_type: S_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Generation Power"
    icon: "mdi:solar-power"
    address: 0x0215
    register_type: "holding"
    value_type: U_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}EPS Voltage"
    icon: "mdi:home-battery"
    address: 0x0216
    register_type: "holding"
    value_type: U_WORD
    filters:
      - multiply: 0.1
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 1
  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}EPS Power"
    icon: "mdi:home-battery"
    address: 0x0217
    register_type: "holding"
    value_type: U_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - multiply: 10
