    name: "${name_prefix}Feed Power"
    icon: "mdi:transmission-tower"
    address: 0x0212
    register_type: "holding"
    value_type: S_WORD
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
