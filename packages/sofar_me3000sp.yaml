    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:timer-outline"

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Inverter Alert Message"
    address: 0x022b
    register_type: "holding"
    value_type: U_WORD
    accuracy_decimals: 0
    icon: "mdi:alert-circle"
    on_value:
      then:
       - text_sensor.template.publish:
           id: ${id_prefix}_alert_description
           state: !lambda |-
            std::string message="";
            int value=(int)x;
            if ((value & 1)) {
              message.append("ID81 ");
            }
            if ((value & 2)) {
              message.append("ID82 ");
            }
            if ((value & 4)) {
              message.append("ID83 ");
            }
            if ((value & 8)) {
              message.append("ID84 ");
            }
            if ((value & 128)) {
              message.append("ID85 ");
            }
            return message;

  - platform: modbus_controller
    modbus_controller_id: ${id_prefix}_controller
    name: "${name_prefix}Battery Cycles"
