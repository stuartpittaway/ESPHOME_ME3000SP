esphome:
  name: sofarme3000sp
  friendly_name: SOFARME3000SP

esp8266:
  board: nodemcu

# Enable logging
logger:
    level: DEBUG
    baud_rate: 0
    hardware_uart: UART1

# Enable Home Assistant API
api:
  encryption:
    key: !secret sofarme3000sp__encryption_key

# OTA updates are encrypted with the API encryption key above.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "SOFAR ME3000 Fallback Hotspot"
    password: !secret ap_fallback_password

captive_portal:
uart:
  id: moduart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 19200
  stop_bits: 1
  data_bits: 8
  parity: NONE
modbus:
  send_wait_time: 250ms
  turnaround_time: 100ms
  uart_id: moduart
  id: modbus1
  flow_control_pin: GPIO5

# One package per inverter on the RS485 bus. The sensor definitions live in
# packages/sofar_me3000sp.yaml (copy that folder next to this file).
#
# name_prefix "" keeps the original entity names, and so the existing
# Home Assistant entities and their history, for the first inverter.
packages:
  inverter1: !include
    file: packages/sofar_me3000sp.yaml
    vars:
      name_prefix: ""
      id_prefix: inverter1
      modbus_address: 1

  # Second inverter: give it a different RS485 address on the inverter itself
  # (Settings > 5. Set Communication Addr.), then uncomment and match it here.
  # inverter2: !include
  #   file: packages/sofar_me3000sp.yaml
  #   vars:
  #     name_prefix: "Inverter 2 "
  #     id_prefix: inverter2
  #     modbus_address: 2
